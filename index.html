<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mustafa Ajaj | AI & Notion Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['IBM Plex Sans Arabic', 'Tajawal', 'sans-serif'],
            },
            colors: {
              zinc: {
                950: '#09090b',
                900: '#18181b',
                800: '#27272a',
                400: '#a1a1aa',
              },
              blue: {
                500: '#3b82f6',
              }
            },
            animation: {
              first: "moveVertical 30s ease infinite",
              second: "moveInCircle 20s reverse infinite",
              third: "moveInCircle 40s linear infinite",
              fourth: "moveHorizontal 40s ease infinite",
              fifth: "moveInCircle 20s ease infinite",
            },
            keyframes: {
              moveHorizontal: {
                "0%": { transform: "translateX(-50%) translateY(-10%)" },
                "50%": { transform: "translateX(50%) translateY(10%)" },
                "100%": { transform: "translateX(-50%) translateY(-10%)" },
              },
              moveInCircle: {
                "0%": { transform: "rotate(0deg)" },
                "50%": { transform: "rotate(180deg)" },
                "100%": { transform: "rotate(360deg)" },
              },
              moveVertical: {
                "0%": { transform: "translateY(-50%)" },
                "50%": { transform: "translateY(50%)" },
                "100%": { transform: "translateY(-50%)" },
              },
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-color: transparent;
        color: #fff;
        overflow-x: hidden;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "@sanity/client": "https://esm.sh/@sanity/client@6.15.0",
    "@sanity/image-url": "https://esm.sh/@sanity/image-url@1.0.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
